
name: HAMA DYLIB EDITOR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Extract DYLIB Images
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Find DYLIB
        id: dylib
        shell: bash
        run: |
          FILE=$(find input -type f -name "*.dylib" -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: No DYLIB found in input/"
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $FILE"

      - name: Extract images
        run: |
          python scripts/extract_images.py "${{ steps.dylib.outputs.file }}"

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: HAMA-DYLIB-EXTRACTED
          path: |
            images/
            output/
          if-no-files-found: error
