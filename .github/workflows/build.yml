
name: HAMA DYLIB EDITOR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  edit-dylib:
    name: Extract and Replace DYLIB Images
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Project Files
        shell: bash
        run: |
          set -e

          test -f scripts/extract_images.py
          test -f scripts/replace_images.py

          mkdir -p input images replacements output

          FILE=$(find input -type f -name "*.dylib" -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: Upload a DYLIB into input/"
            exit 1
          fi

          echo "DYLIB_FILE=$FILE" >> "$GITHUB_ENV"
          echo "Found: $FILE"

      - name: Extract Original Images
        run: |
          python scripts/extract_images.py "$DYLIB_FILE"

      - name: Replace Images
        run: |
          python scripts/replace_images.py \
            "$DYLIB_FILE" \
            replacements \
            output/HAMA-EDITED.dylib

      - name: Verify Output
        shell: bash
        run: |
          set -e

          test -s output/HAMA-EDITED.dylib

          echo "HAMA DYLIB EDITOR completed."
          ls -lh output/HAMA-EDITED.dylib

      - name: Upload Final DYLIB
        uses: actions/upload-artifact@v4
        with:
          name: HAMA-EDITED-DYLIB
          path: output/HAMA-EDITED.dylib
          if-no-files-found: error

      - name: Upload Image Manifest
        uses: actions/upload-artifact@v4
        with:
          name: HAMA-IMAGE-MANIFEST
          path: output/image_manifest.json
          if-no-files-found: error
